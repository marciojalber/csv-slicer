<br/>
<div class="text-xl mb-2">HEADER</div>
<div class="rounded-lg mb-2 p-2 bg-white border border-gray-400">
  <table class="table-auto w-full border-collapse text-sm">
    <thead>
      <tr>
        <th class="border-b-2 border-gray-300 px-4 pt-0 pb-3 text-left font-medium text-gray-400 dark:border-gray-600 dark:text-gray-400">
          <button
            @click  = "exposed.selectCols()"
            class   = "btn btn-link"
          >
            <i
              :class  = "exposed.colsIcon"
            ></i>
          </button>
          COLUMN
        </th>
        <th class="border-b-2 border-gray-300 px-8 pt-0 pb-3 text-left font-medium text-gray-400 dark:border-gray-600 dark:text-gray-400">RENAME_TO</th>
        <th class="border-b-2 border-gray-300 px-4 pt-0 pb-3 text-left font-medium text-gray-400 dark:border-gray-600 dark:text-gray-400">FORMATTER_TO</th>
        <th class="border-b-2 border-gray-300 px-4 pt-0 pb-3 text-left font-medium text-gray-400 dark:border-gray-600 dark:text-gray-400">FILTER</th>
        <th class="border-b-2 border-gray-300 px-4 pt-0 pb-3 text-left font-medium text-gray-400 dark:border-gray-600 dark:text-gray-400">ACTION</th>
      </tr>
    </thead>
    <tbody>
      <tr
        v-for="col in exposed.header"
        :class = "{'text-gray': !exposed.columns[col]}"
      >
        <td class="px-4">
          <div class="form-group">
            <label class="truncate cursor-pointer">
              <input
                @change = "exposed.colsClick(col)"
                type    = "checkbox"
                class   = "size-4 rounded border-gray-300 shadow-sm float-left mt-1 mr-2"
                v-model = "exposed.columns[col]"
              >
              <span class="font-light" v-text="col"></span>
            </label>
          </div>
        </td>
        <td class="text-gray px-4">
          <input
            class   = "form-input"
            v-model = "exposed.renames[col]"
          />
        </td>
        <td class="text-gray px-4">
          <label class="cursor-pointer">
            <input
              type    = "checkbox"
              v-model = "exposed.toDigit[col]"
              class   = "size-4 rounded border-gray-300 shadow-sm float-left mt-1 mr-2"
            >
            <span class="font-light">Only digits</span>
          </label>
        </td>
        <td class="text-gray-300 px-4">[UNAVAILABLE]</td>
        <td class="text-gray-300 px-4">[UNAVAILABLE]</td>
      </tr>
      <tr v-if="!exposed.header.length">
        <td colspan="5" class="px-4">
          <span class="chip">NO HEADER</span>
        </td>
      </tr>
    </tbody>
  </table>
</div>
